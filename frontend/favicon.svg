<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2" />
  <!-- Rayons du soleil matinal -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="14" />
    <line x1="17" y1="16" x2="20" y2="19" />
    <line x1="47" y1="16" x2="44" y2="19" />
    <line x1="11" y1="30" x2="15" y2="30" />
    <line x1="53" y1="30" x2="49" y2="30" />
  </g>
  <!-- Demi-soleil levant -->
  <path d="M18 34 A14 14 0 0 1 46 34 Z" fill="url(#sun)" />
  <!-- Horizon et lignes de presse/veille -->
  <line x1="10" y1="38" x2="54" y2="38" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <line x1="15" y1="45" x2="49" y2="45" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round" />
  <line x1="21" y1="52" x2="43" y2="52" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" />
</svg>
