---
apiVersion: v1
kind: Namespace
metadata:
  name: morning-review
  labels:
    app.kubernetes.io/name: morning-review
---
# Cluster PostgreSQL 17 + pgvector géré par CloudNativePG (génère automatiquement le secret morning-review-pg-app)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: morning-review-pg
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: morning_review
      owner: morning
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
---
# Volume partagé sur le nœud K3s pour le cache ONNX FastEmbed (220 Mo) et les rapports Markdown générés
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: morning-review-cache-pvc
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: morning-review
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: morning-review
  template:
    metadata:
      labels:
        app.kubernetes.io/name: morning-review
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: morning-review
          image: ghcr.io/mathfrenchtoast/morning-review:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: morning-review-env-secret
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8000"
            - name: PUBLIC_UI_URL
              value: "https://review.perso.frenchtoast.dev"
            - name: ENABLE_BACKGROUND_INGEST
              value: "false"
            - name: FASTEMBED_CACHE_PATH
              value: "/app/.cache/fastembed"
            - name: OMP_NUM_THREADS
              value: "2"
            # Surcharge DATABASE_URL du .env par l'URI du cluster CloudNativePG interne
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: morning-review-pg-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache-volume
              mountPath: /app/.cache/fastembed
              subPath: fastembed
            - name: cache-volume
              mountPath: /app/reports
              subPath: reports
            - name: cache-volume
              mountPath: /app/.data/s3
              subPath: s3-cache
          livenessProbe:
            httpGet:
              path: /api/v1/topics?limit=1
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/topics?limit=1
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: morning-review-cache-pvc
---
# CronJob 1 : Rafraîchissement horaire (Gmail IMAP + validation double opt-in + RSS/Podcasts/YouTube + Clustering)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: morning-review-refresh-hourly
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
    app.kubernetes.io/component: cron-refresh
spec:
  schedule: "0 * * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: morning-review-cron
            app.kubernetes.io/component: cron-refresh
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: ghcr.io/mathfrenchtoast/morning-review:latest
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  morning-review init
                  morning-review fetch-gmail --max-messages 40 --since-days 7
                  morning-review fetch-rss --max-entries 8
                  morning-review cluster
              envFrom:
                - secretRef:
                    name: morning-review-env-secret
              env:
                - name: APP_ENV
                  value: "production"
                - name: PUBLIC_UI_URL
                  value: "https://review.perso.frenchtoast.dev"
                - name: FASTEMBED_CACHE_PATH
                  value: "/app/.cache/fastembed"
                - name: OMP_NUM_THREADS
                  value: "2"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: morning-review-pg-app
                      key: uri
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: cache-volume
                  mountPath: /app/.cache/fastembed
                  subPath: fastembed
                - name: cache-volume
                  mountPath: /app/reports
                  subPath: reports
                - name: cache-volume
                  mountPath: /app/.data/s3
                  subPath: s3-cache
              resources:
                requests:
                  cpu: 100m
                  memory: 384Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi
          volumes:
            - name: cache-volume
              persistentVolumeClaim:
                claimName: morning-review-cache-pvc
---
# CronJob 2 : Morning Review quotidien à 06h30 (Europe/Paris) — Relève complète + Clustering + Digest + Envoi e-mail
apiVersion: batch/v1
kind: CronJob
metadata:
  name: morning-review-daily-06h30
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
    app.kubernetes.io/component: cron-daily-digest
spec:
  schedule: "30 6 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels:
            app.kubernetes.io/name: morning-review-cron
            app.kubernetes.io/component: cron-daily-digest
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: daily-digest
              image: ghcr.io/mathfrenchtoast/morning-review:latest
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  morning-review init
                  morning-review fetch-gmail --max-messages 60 --since-days 7 || true
                  morning-review fetch-rss --max-entries 8 || true
                  morning-review cluster || true
                  morning-review digest --max-topics 14 --send-email
              envFrom:
                - secretRef:
                    name: morning-review-env-secret
              env:
                - name: APP_ENV
                  value: "production"
                - name: PUBLIC_UI_URL
                  value: "https://review.perso.frenchtoast.dev"
                - name: FASTEMBED_CACHE_PATH
                  value: "/app/.cache/fastembed"
                - name: OMP_NUM_THREADS
                  value: "2"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: morning-review-pg-app
                      key: uri
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: cache-volume
                  mountPath: /app/.cache/fastembed
                  subPath: fastembed
                - name: cache-volume
                  mountPath: /app/reports
                  subPath: reports
                - name: cache-volume
                  mountPath: /app/.data/s3
                  subPath: s3-cache
              resources:
                requests:
                  cpu: 100m
                  memory: 384Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi
          volumes:
            - name: cache-volume
              persistentVolumeClaim:
                claimName: morning-review-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: morning-review
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: morning-review
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
# Middleware Traefik BasicAuth (référence le Secret morning-review-basic-auth-secret créé hors-Git, idem allbal)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: morning-review-basic-auth
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
spec:
  basicAuth:
    secret: morning-review-basic-auth-secret
    removeHeader: true
---
# ClusterIssuer Let's Encrypt (solveur HTTP-01 attaché à morning-review-gateway)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-morning-review-prod
  labels:
    app.kubernetes.io/name: morning-review
spec:
  acme:
    email: mathieu@frenchtoast.dev
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-morning-review-prod-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                name: morning-review-gateway
                namespace: traefik
                kind: Gateway
---
# Certificat TLS Let's Encrypt pour review.perso.frenchtoast.dev
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: morning-review-gateway-tls
  namespace: traefik
  labels:
    app.kubernetes.io/name: morning-review
spec:
  secretName: morning-review-gateway-tls-secret
  issuerRef:
    name: letsencrypt-morning-review-prod
    kind: ClusterIssuer
  dnsNames:
    - review.perso.frenchtoast.dev
---
# Gateway dédiée dans le namespace traefik (ports internes Traefik K3s : 8000 pour web, 8443 pour websecure)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: morning-review-gateway
  namespace: traefik
  labels:
    app.kubernetes.io/name: morning-review
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: review.perso.frenchtoast.dev
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: review.perso.frenchtoast.dev
      tls:
        mode: Terminate
        certificateRefs:
          - name: morning-review-gateway-tls-secret
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
---
# Route Kubernetes Gateway API (review.perso.frenchtoast.dev) protégée par BasicAuth
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: morning-review-route
  namespace: morning-review
  labels:
    app.kubernetes.io/name: morning-review
spec:
  parentRefs:
    - name: morning-review-gateway
      namespace: traefik
  hostnames:
    - review.perso.frenchtoast.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: morning-review-basic-auth
      backendRefs:
        - name: morning-review
          port: 8000
