apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: morning-review
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mathfrenchtoast/morning-review.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: morning-review
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /status
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/imagePullPolicy
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/terminationGracePeriodSeconds
        - /spec/revisionHistoryLimit
        - /spec/progressDeadlineSeconds
    - group: batch
      kind: CronJob
      jsonPointers:
        - /spec/suspend
        - /spec/jobTemplate/spec/template/spec/dnsPolicy
        - /spec/jobTemplate/spec/template/spec/schedulerName
        - /spec/jobTemplate/spec/template/spec/terminationGracePeriodSeconds
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /spec/instances
        - /spec/postgresGID
        - /spec/postgresUID
        - /spec/logLevel
        - /spec/maxSyncReplicas
        - /spec/minSyncReplicas
        - /spec/primaryUpdateMethod
        - /spec/primaryUpdateStrategy
        - /spec/replicationSlots
        - /spec/smartShutdownTimeout
        - /spec/startDelay
        - /spec/stopDelay
        - /spec/switchoverDelay
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
        - /spec/volumeMode
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
    - group: gateway.networking.k8s.io
      kind: Gateway
      jsonPointers:
        - /spec/listeners/0/tls
        - /spec/listeners/1/tls/certificateRefs/0/group
    - group: cert-manager.io
      kind: ClusterIssuer
      jsonPointers:
        - /spec/acme/privateKeySecretRef/key
    - group: cert-manager.io
      kind: Certificate
      jsonPointers:
        - /spec/issuerRef/group
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
